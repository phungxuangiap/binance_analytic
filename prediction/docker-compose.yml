services:
  postgres:
    image: postgres:16-alpine
    container_name: prediction-postgres
    environment:
      POSTGRES_DB: prediction
      POSTGRES_USER: prediction
      POSTGRES_PASSWORD: prediction
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: prediction-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgres://prediction:prediction@postgres:5432/prediction
      DATABASE_INIT_RETRY_COUNT: 20
      DATABASE_INIT_RETRY_DELAY_MS: 1000
      BINANCE_WS_BASE_URL: wss://stream.binance.com:9443
      BINANCE_RECONNECT_DELAY_MS: 5000
      NEWS_PREDICTION_INTERVAL_MS: 300000
      NEWS_PREDICTION_BATCH_SIZE: 10
    command: npm run dev
    ports:
      - "4001:4000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped

  news-crawler:
    build:
      context: ./backend
      dockerfile: Dockerfile.crawler
    container_name: prediction-news-crawler
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://prediction:prediction@postgres:5432/prediction
      CRAWL_INTERVAL_SECONDS: 300
    command: python src/scripts/scheduled_crawl_news.py
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: prediction-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: prediction-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    ports:
      - "3003:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
  backend-node-modules:
  frontend-node-modules:
  frontend-next-cache:
